# Device Monitor — device.faltu.shop
# Copy to: /etc/nginx/sites-available/device.faltu.shop
# Enable:  sudo ln -sf /etc/nginx/sites-available/device.faltu.shop /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d device.faltu.shop

server {
    listen 80;
    server_name device.faltu.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name device.faltu.shop;

    ssl_certificate /etc/letsencrypt/live/device.faltu.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/device.faltu.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    # Backend API
    location /api {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
    }

    # Socket.IO (real-time updates)
    location /socket.io {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
